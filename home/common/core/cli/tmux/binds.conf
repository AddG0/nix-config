# Unbinding
unbind %
unbind '"'
unbind r
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Bind Keys
bind | split-window -h
bind - split-window -v
bind r source-file ~/.config/tmux/tmux.conf

# Resize mode: prefix + Ctrl-Arrow starts resizing; bare arrows continue, any
# other key exits. Prefix-gated so it never clashes with nixvim's <C-Arrow>.
bind -T prefix C-Left  resize-pane -L 5 \; switch-client -T resize
bind -T prefix C-Right resize-pane -R 5 \; switch-client -T resize
bind -T prefix C-Up    resize-pane -U 5 \; switch-client -T resize
bind -T prefix C-Down  resize-pane -D 5 \; switch-client -T resize

bind -T resize Left  resize-pane -L 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize Up    resize-pane -U 5 \; switch-client -T resize
bind -T resize Down  resize-pane -D 5 \; switch-client -T resize

# Pane Navigation (Alt + Arrow keys)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Renaming (without repeat)
bind , command-prompt -p "#{@prompt_rename_window}" -I "#W" "rename-window '%%'"
bind $ command-prompt -p "#{@prompt_rename_session}" -I "#S" "rename-session '%%'"

# Session management
bind s choose-tree -s -Z
bind S command-prompt -p "#{@prompt_new_session}" "new-session -s '%%'"

# New window (without repeat)
bind c new-window -c "#{pane_current_path}"

# Move window
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Clear pane scrollback
bind K clear-history \; display-message "pane history cleared"
