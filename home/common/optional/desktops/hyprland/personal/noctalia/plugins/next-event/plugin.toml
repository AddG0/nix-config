id           = "addg/next-event"
name         = "Next Event"
version      = "1.0.0"
plugin_api   = 4              # mandatory since Noctalia v5 (API level 4); omitting it silently drops the plugin
min_noctalia = "5.0.0"
author       = "addg"
license      = "MIT"
icon         = "calendar-month"
description  = "Shows the next upcoming calendar event from Noctalia's event cache."
tags         = ["calendar", "bar"]

[[widget]]
id    = "agenda"
entry = "next-event.luau"

  [[widget.setting]]
  key       = "max_chars"
  type      = "int"
  label_key = "settings.max_chars.label"
  default   = 22
  min       = 6
  max       = 60

  # Only surface an event once it starts within this window (0 = no limit; ongoing always shows).
  [[widget.setting]]
  key       = "lookahead_minutes"
  type      = "int"
  label_key = "settings.lookahead_minutes.label"
  default   = 30
  min       = 0
  max       = 1440

  [[widget.setting]]
  key       = "refresh_seconds"
  type      = "int"
  label_key = "settings.refresh_seconds.label"
  default   = 30
  min       = 5
  max       = 600
