id           = "addg/otd-mode"
name         = "Tablet Mode"
version      = "1.0.0"
plugin_api   = 4              # mandatory since Noctalia v5 (API level 4); omitting it silently drops the plugin
min_noctalia = "5.0.0"
author       = "addg"
license      = "MIT"
icon         = "pointer"
description  = "Shows the OpenTabletDriver output mode and cycles Absolute -> Relative -> Artist on click."
tags         = ["tablet", "bar"]

[[widget]]
id    = "switcher"
entry = "otd-mode.luau"

  [[widget.setting]]
  key       = "refresh_seconds"
  type      = "int"
  label_key = "settings.refresh_seconds.label"
  default   = 5
  min       = 2
  max       = 60
